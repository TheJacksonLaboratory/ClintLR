name: Build GUI JARs and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # The LIRICAL tag to check out. The tag must correspond to the LIRICAL version used by ClintLR
  LIRICAL_TAG: v2.4.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macOS-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 24
          distribution: 'graalvm'

      - name: Install LIRICAL
        run: |
          cd ..
          git clone https://github.com/TheJacksonLaboratory/LIRICAL
          cd LIRICAL
          git checkout $LIRICAL_TAG
          ./mvnw --quiet -PskipTests -Prelease install

      - name: Build with Maven
        run: ./mvnw -PskipTests package

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: clintlr-gui-${{ matrix.os }}
          path: clintlr-gui/target/clintlr-gui-*.jar
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: clintlr-gui/target/

      - name: Display structure
        run: ls -R clintlr-gui/target/

      - name: Create Release
        uses: softprops/action-gh-release@v4
        with:
          files: |
            clintlr-gui/target/clintlr-gui-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
